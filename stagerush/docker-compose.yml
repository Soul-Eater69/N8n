# ─── StageRush Docker Compose ───────────────────────────────────────
# Production-ready multi-service deployment
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d --scale api=3  # Scale API to 3 instances
#   docker compose logs -f api        # Follow API logs
#   docker compose down -v            # Tear down with volumes
# ────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stagerush-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stagerush
      POSTGRES_USER: stagerush
      POSTGRES_PASSWORD: stagerush_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagerush"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stagerush

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stagerush-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stagerush

  # ── Backend API ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: stagerush-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4100
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://stagerush:stagerush_secret@postgres:5432/stagerush
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-64-char-random-string}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3000
      QUEUE_DRAIN_RATE: 100
      SEAT_LOCK_TTL_MS: 420000
      LOG_LEVEL: info
    ports:
      - "4100:4100"
    networks:
      - stagerush

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: stagerush-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost
    ports:
      - "3000:3000"
    networks:
      - stagerush

  # ── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: stagerush-nginx
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - stagerush

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  stagerush:
    driver: bridge
