apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagerush-frontend
  namespace: stagerush
  labels:
    app: stagerush
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stagerush
      component: frontend
  template:
    metadata:
      labels:
        app: stagerush
        component: frontend
    spec:
      containers:
        - name: frontend
          image: stagerush/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.stagerush.io/api/v1"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.stagerush.io"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stagerush-frontend
  namespace: stagerush
spec:
  selector:
    app: stagerush
    component: frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stagerush-frontend-hpa
  namespace: stagerush
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stagerush-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
