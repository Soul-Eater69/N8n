apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stagerush-ingress
  namespace: stagerush
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/rate-limit-window: "1s"
    nginx.ingress.kubernetes.io/websocket-services: "stagerush-api"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "7200"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stagerush.io
        - api.stagerush.io
      secretName: stagerush-tls
  rules:
    - host: stagerush.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stagerush-frontend
                port:
                  number: 3000
    - host: api.stagerush.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stagerush-api
                port:
                  number: 4100
