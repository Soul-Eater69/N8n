apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagerush-api
  namespace: stagerush
  labels:
    app: stagerush
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stagerush
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stagerush
        component: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: stagerush/api:latest
          ports:
            - containerPort: 4100
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4100"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stagerush-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stagerush-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stagerush-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: stagerush-api
  namespace: stagerush
spec:
  selector:
    app: stagerush
    component: api
  ports:
    - port: 4100
      targetPort: 4100
      protocol: TCP
  type: ClusterIP
